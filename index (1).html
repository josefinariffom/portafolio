<script>
(function(){'use strict';
const names=['inicio','perfil','experiencia','proyectos','contacto'];const screens=names.map(n=>document.getElementById(n));const menu=document.getElementById('navegacion');const modal=document.getElementById('project-modal');let focusBefore=null;let modalBefore=null;
function current(){return names.includes(location.hash.substring(1))?location.hash.substring(1):'inicio'}
function hideMenu(restore=true){let opened=!menu.hidden;menu.hidden=true;document.body.classList.remove('menu-open');if(restore&&opened&&focusBefore?.focus)focusBefore.focus()}
function showMenu(){focusBefore=document.activeElement;menu.hidden=false;document.body.classList.add('menu-open');document.getElementById('menu-close').focus()}
function activate(){const value=current();screens.forEach(s=>s.hidden=s.id!==value);menu.querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',a.hash==='#'+value?'page':'false'));hideMenu(false);closeProject(false);scrollTo({top:0,left:0,behavior:'instant'});document.title=(value==='inicio'?'Josefina Riffo':value.toUpperCase()+' — Josefina Riffo')+' | Portafolio'}
document.querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click',showMenu));document.getElementById('menu-close').addEventListener('click',()=>hideMenu());menu.addEventListener('click',e=>{if(e.target===menu)hideMenu()});menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>hideMenu(false)));document.getElementById('skip-nav').addEventListener('click',e=>{e.preventDefault();showMenu()});window.addEventListener('hashchange',activate);
const groups=[{"title": "Little Toys Morgue", "images": ["imagenes/ltm-1.png", "imagenes/ltm-2.png", "imagenes/ltm-3.png", "imagenes/ltm-4.png", "imagenes/ltm-5.png"], "paragraphs": ["Little Toys Morgue es un e-commerce de art toys de nicho. Aquí, cada muñeco tiene una historia, algunas más terribles que otras.", "Little Toys Morgue es un proyecto mío que llevo creando hace algunos meses como modo de ocio. Para que el proyecto funcionara, estudié perseverantemente cómo crear una marca con identidad, creando su buyer persona, manual de marca, estudios de mercado y de la competencia, entre otros.", "Lo más importante para mí era una cosa: que Little Toys Morgue no fuera simplemente una tienda de muñecas customizadas. Su concepto de morgue, los expedientes médicos, las autopsias, las etiquetas y los certificados deben crear un universo reconocible. Mejor dicho, que el comprador se llevara una experiencia inolvidable."]}, {"title": "Creación de Contenido", "images": ["imagenes/contenido-1.jpeg", "imagenes/contenido-2.jpeg", "imagenes/contenido-3.jpeg", "imagenes/contenido-4.jpeg", "imagenes/contenido-5.jpeg"], "paragraphs": ["Jo_semola es un perfil que creé por ocio para relatar mi vida aquí en Madrid. Cuando creé Little Toys Morgue, decidí que debía crear una estrategia de redes si quería que mi proyecto triunfara. Así que, luego de algunos cursos de cómo gestionar redes, decidí realizar una estrategia de redes sociales en Instagram y TikTok. Y bueno, los resultados hablan por sí solos.", "En cosa de tres meses, mi cuenta de Instagram subió a 64.000 seguidores y la de TikTok a 150.000, todo de manera orgánica. Yo no lo podía creer. Calcé con un público objetivo exacto y ellos conmigo. Hoy subo contenido de manera más casual, pero tengo detrás a una comunidad hermosa por la que también me gusta esforzarme día a día."]}, {"title": "Proyectos Audiovisuales", "images": ["imagenes/audiovisual-1.png", "imagenes/audiovisual-2.jpg", "imagenes/audiovisual-3.jpeg"], "paragraphs": ["A través de mi vida he trabajado en muchos proyectos audiovisuales. El haber estudiado cine y animación me llevó a muchos lugares interesantes, lugares donde había que trabajar eficazmente y solucionar problemas rápidamente. Esta misma experiencia me llevó a trabajar mucho mi capacidad de trabajar en equipo, liderar y saber comunicar mis ideas.", "Dentro de mis experiencias me gustaría destacar tres de ellas:", "Codirectora del cortometraje animado «Vamos a Blondie», donde trabajé un año con un equipo de 6 personas a mi cargo, creando a partir de cero un cortometraje de más de 3 minutos. Fue un trabajo con mucho esfuerzo detrás y un gran trabajo en equipo. Con mi codirectora logramos inspirar al equipo y así afrontar todas las adversidades.", "Coguionista de la serie «Ciudad Tributo», una serie animada para el Servicio de Impuestos Internos en Chile. Lograr hacer una serie de cómo funcionan los impuestos para niños fue un gran desafío, en especial con el Servicio de Impuestos Internos a nuestras espaldas, pero finalmente supimos adaptarnos y entregar un trabajo de calidad para el cliente.", "Animadora de la serie «Cuestión de Mente», un proyecto de serie financiado por Corfo sobre las aventuras de 3 niños mientras aprenden de neurociencia. En este trabajo, me tocó trabajar junto a grandes de la industria de las comunicaciones en Chile, aprendiendo mucho de ellos y cómo explayar mis ideas en proyectos."]}, {"title": "Trabajos para Redes Sociales", "images": ["imagenes/redes-1.png", "imagenes/redes-2.jpg", "imagenes/redes-3.png", "imagenes/redes-4.jpeg", "imagenes/redes-5.png"], "paragraphs": ["He trabajado de manera freelance en muchos proyectos de redes sociales, saliendo de mi statu quo y trabajando para todo tipo de públicos objetivos. Me encanta entender una marca y, a través del diseño y la estrategia, hablar el mismo idioma que ella.", "Entre las que cabe destacar, trabajé para REF Santiago, ayudando en las plantillas para sus diferentes publicaciones e infografías, al igual que trabajé para la Fundación Raíces de Transformación en publicaciones para las redes sociales. He trabajado también para pequeñas pymes e influencers, ayudándolos a hacer contenido para concursos, historias y carruseles. Mucho del contenido en el que trabajé es propiedad intelectual de sus empresas, por lo cual no puedo mostrarlo.", "Me encanta analizar cómo las personas se relacionan, qué despierta su curiosidad, por qué determinados contenidos conectan con una audiencia y cómo una idea puede convertirse en una comunidad. Amo experimentar, contar historias, construir identidades de marca y medir cómo responde la gente."]}];
let chosen=0,photoIndex=0,touchStart=0;const heading=document.getElementById('project-heading'),text=document.getElementById('project-text'),photo=document.getElementById('project-photo'),count=document.getElementById('project-count');
function renderPhoto(){const images=groups[chosen].images.slice(1);photo.src='proyectos/'+images[photoIndex];photo.alt='Fotografía original '+(photoIndex+1)+' de '+images.length+' de '+groups[chosen].title;count.textContent=(photoIndex+1)+' / '+images.length;document.getElementById('previous-photo').disabled=photoIndex===0;document.getElementById('next-photo').disabled=photoIndex===images.length-1}
function openProject(n){modalBefore=document.activeElement;chosen=n;photoIndex=0;heading.textContent=groups[n].title;text.replaceChildren();groups[n].paragraphs.forEach(v=>{const p=document.createElement('p');p.textContent=v;text.appendChild(p)});renderPhoto();modal.hidden=false;document.body.classList.add('menu-open');document.getElementById('modal-close').focus()}
function closeProject(restore=true){const opened=!modal.hidden;modal.hidden=true;if(menu.hidden)document.body.classList.remove('menu-open');if(restore&&opened&&modalBefore?.focus)modalBefore.focus()}
function step(dir){photoIndex=Math.max(0,Math.min(groups[chosen].images.length-2,photoIndex+dir));renderPhoto()}
document.querySelectorAll('[data-project]').forEach(b=>b.addEventListener('click',()=>openProject(Number(b.dataset.project))));document.getElementById('modal-close').addEventListener('click',()=>closeProject());document.getElementById('previous-photo').addEventListener('click',()=>step(-1));document.getElementById('next-photo').addEventListener('click',()=>step(1));modal.addEventListener('click',e=>{if(e.target===modal)closeProject()});photo.addEventListener('touchstart',e=>touchStart=e.changedTouches[0].clientX,{passive:true});photo.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-touchStart;if(Math.abs(delta)>35)step(delta<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(!modal.hidden){if(e.key==='Escape')closeProject();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);return}if(!menu.hidden&&e.key==='Escape')hideMenu();});
activate();})();
</script></body></html>
